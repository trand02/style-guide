<!-- Вставить: Настройки страницы → Вставка кода → HTML-код перед </BODY> -->

<script>
(function () {
  function init() {
    var nav = document.getElementById('sg-nav');
    if (!nav) return;
    var links = [].slice.call(nav.querySelectorAll('.sg-nav__link'));
    var toggles = [].slice.call(nav.querySelectorAll('.sg-nav__toggle[aria-expanded]'));
    var burger = document.getElementById('sg-burger');
    var filter = document.getElementById('sg-filter');
    var byId = {};
    links.forEach(function (a) { byId[a.dataset.target] = a; });

    function setOpen(btn, open) {
      var list = document.getElementById(btn.getAttribute('aria-controls'));
      if (!list) return;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', (open ? 'Свернуть раздел ' : 'Развернуть раздел ') +
        btn.parentElement.querySelector('.sg-nav__text').textContent);
      list.hidden = !open;
    }

    toggles.forEach(function (btn) {
      btn.addEventListener('click', function () {
        setOpen(btn, btn.getAttribute('aria-expanded') !== 'true');
      });
    });

    // открытой остаётся только ветка активного раздела, остальные сворачиваются
    function reveal(link) {
      var activeItem = link ? link.closest('.sg-nav__item') : null;
      toggles.forEach(function (btn) {
        var owner = btn.closest('.sg-nav__item');
        var keepOpen = !!(activeItem && owner && (owner === activeItem || owner.contains(activeItem)));
        if ((btn.getAttribute('aria-expanded') === 'true') !== keepOpen) setOpen(btn, keepOpen);
      });
    }

    // подсветка текущего раздела при прокрутке.
    // берём последнюю секцию, чей верх уже прошёл линию чтения, — это всегда
    // самый глубокий из открытых разделов, поэтому подсвечивается и подраздел
    var secs = [].slice.call(document.querySelectorAll('.sg-sec'));
    var ticking = false;

    function depth(sec) {
      var d = 0, p = sec.parentElement;
      while (p) { if (p.classList && p.classList.contains('sg-sec')) d++; p = p.parentElement; }
      return d;
    }

    function highlight() {
      ticking = false;
      var line = 140, current = null;
      for (var i = 0; i < secs.length; i++) {
        var top = secs[i].getBoundingClientRect().top;
        if (top - line <= 0) {
          if (!current || depth(secs[i]) >= depth(current) || secs[i].contains(current) === false) current = secs[i];
        }
      }
      if (!current && secs.length) current = secs[0];
      links.forEach(function (a) {
        a.classList.remove('is-active');
        var r = a.closest('.sg-nav__row'); if (r) r.classList.remove('is-active');
      });
      var node = current, first = true;
      while (node) {
        var link = byId[node.id];
        if (link) {
          if (first) {
            link.classList.add('is-active');
            var row = link.closest('.sg-nav__row');     // подсветка на всю строку, вместе со стрелкой
            if (row) row.classList.add('is-active');
          }
          if (first) reveal(link);
          first = false;
        }
        node = node.parentElement ? node.parentElement.closest('.sg-sec') : null;
      }
    }

    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(highlight); }
    }, { passive: true });
    window.addEventListener('resize', highlight);
    highlight();

    links.forEach(function (a) {
      a.addEventListener('click', function (e) {
        var target = document.getElementById(a.dataset.target);
        if (!target) return;
        e.preventDefault();
        var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (typeof revealAncestorTabs === 'function') revealAncestorTabs(a.dataset.target);
        target.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        history.replaceState(null, '', '#' + a.dataset.target);
        var own = a.parentElement.querySelector('.sg-nav__toggle[aria-expanded]');
        if (own) setOpen(own, true);
        if (window.innerWidth < 992) { nav.classList.remove('is-open'); burger.setAttribute('aria-expanded', 'false'); }
      });
    });

    // поиск: ищем не только в названиях пунктов меню, но и в тексте самих разделов —
    // иначе фраза, HEX-код или цитата, которых нет в заголовке, не находились вовсе.
    // берём textContent, а не innerText: у innerText «не видит» содержимое скрытых
    // вкладок (hidden-панели презентаций), а раздел должен находиться поиском целиком,
    // независимо от того, какая вкладка сейчас открыта. сами расставляем пробелы
    // на границах тегов, иначе соседние блоки склеятся в одно слово
    function textWithGaps(el) {
      var parts = [];
      (function walk(node) {
        if (node.nodeType === 3) { parts.push(node.nodeValue); return; }
        if (node.nodeType !== 1 || node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
        for (var i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
        parts.push(' ');
      })(el);
      return parts.join('').replace(/\s+/g, ' ').trim();
    }
    // индекс считаем один раз при загрузке: у страницы фиксированный текст,
    // содержимое разделов не меняется от копирования значений или смены вкладки
    if (filter) {
      var searchIndex = [].slice.call(nav.querySelectorAll('.sg-nav__item')).map(function (li) {
        var link = li.querySelector('.sg-nav__link');
        var target = document.getElementById(link.dataset.target);
        return { li: li, link: link, title: link.textContent.toLowerCase(),
          body: target ? textWithGaps(target).toLowerCase() : '' };
      });
      filter.addEventListener('input', function () {
        var q = filter.value.trim().toLowerCase();
        var items = searchIndex.map(function (row) { return row.li; });
        nav.querySelectorAll('.sg-nav__snippet').forEach(function (s) { s.remove(); });
        if (!q) {
          items.forEach(function (li) { li.hidden = false; });
          toggles.forEach(function (btn) { setOpen(btn, true); });
          var m0 = nav.querySelector('.sg-nav__empty'); if (m0) m0.remove();
          return;
        }
        var shown = 0;
        items.forEach(function (li) { li.hidden = true; });
        searchIndex.forEach(function (row) {
          var li = row.li;
          var inTitle = row.title.indexOf(q) !== -1;
          var pos = inTitle ? -1 : row.body.indexOf(q);
          if (!inTitle && pos === -1) return;
          shown++;
          li.hidden = false;
          li.querySelectorAll('.sg-nav__item').forEach(function (kid) { kid.hidden = false; });
          var p = li.parentElement ? li.parentElement.closest('.sg-nav__item') : null;
          while (p) { p.hidden = false; p = p.parentElement.closest('.sg-nav__item'); }
          // совпадение только в тексте раздела — показываем цитату, чтобы было понятно, за что зацепился поиск
          if (!inTitle && pos !== -1) {
            var from = Math.max(0, pos - 26);
            var quote = (from > 0 ? '…' : '') + row.body.slice(from, pos + q.length + 26).trim() + '…';
            var snip = document.createElement('p');
            snip.className = 'sg-nav__snippet';
            snip.textContent = quote;
            var rowEl = li.querySelector('.sg-nav__row');
            if (rowEl) rowEl.insertAdjacentElement('afterend', snip);
          }
        });
        toggles.forEach(function (btn) { setOpen(btn, true); });
        var msg = nav.querySelector('.sg-nav__empty');
        if (!shown && !msg) {
          msg = document.createElement('p');
          msg.className = 'sg-nav__empty';
          msg.textContent = 'Ничего не нашлось';
          nav.querySelector('.sg-nav__body').appendChild(msg);
        } else if (shown && msg) { msg.remove(); }
      });
    }


    // «обновлено» — возраст инструкции и подсветка устаревших
    [].slice.call(document.querySelectorAll('.sg-updated')).forEach(function (box) {
      var t = box.querySelector('time');
      var age = box.querySelector('.sg-updated__age');
      if (!t || !age) return;
      var d = new Date(t.getAttribute('datetime'));
      if (isNaN(d)) return;
      var days = Math.floor((Date.now() - d.getTime()) / 86400000);
      var text;
      if (days <= 0) text = 'сегодня';
      else if (days === 1) text = 'вчера';
      else if (days < 30) text = days + ' дн. назад';
      else if (days < 365) { var mo = Math.round(days / 30); text = mo + ' мес. назад'; }
      else { var y = Math.floor(days / 365); text = y + (y === 1 ? ' год назад' : ' г. назад'); }
      age.textContent = '· ' + text;
      if (days > 180) {
        box.classList.add('is-stale');
        box.title = 'Инструкция не обновлялась больше полугода — стоит проверить актуальность';
      }
    });

    // копирование текста инструкции
    [].slice.call(document.querySelectorAll('.sg-prompt')).forEach(function (box) {
      var btn = box.querySelector('.sg-prompt__copy');
      var pre = box.querySelector('.sg-prompt__text');
      if (!btn || !pre) return;
      // кнопка лежит внутри <summary> — без этого клик по ней ещё и раскрывал бы/
      // сворачивал промт, а копировать хочется и не разворачивая его
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var text = pre.textContent;
        var done = function () {
          btn.classList.add('is-copied');
          var was = btn.textContent; btn.textContent = 'Скопировано';
          setTimeout(function () { btn.classList.remove('is-copied'); btn.textContent = was; }, 1400);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done, done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.cssText = 'position:absolute;left:-9999px';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          document.body.removeChild(ta);
        }
      });
    });

    // копирование отдельных значений в крупных карточках цвета
    [].slice.call(document.querySelectorAll('.sg-color__row[data-copy]')).forEach(function (row) {
      function done() {
        var val = row.querySelector('.sg-color__value');
        var was = val.textContent;
        row.classList.add('is-copied');
        val.textContent = 'скопировано';
        setTimeout(function () { row.classList.remove('is-copied'); val.textContent = was; }, 1200);
      }
      function copy() {
        var text = row.getAttribute('data-copy');
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done, done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.cssText = 'position:absolute;left:-9999px';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          document.body.removeChild(ta);
        }
      }
      row.addEventListener('click', copy);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); }
      });
    });

    // построчное копирование в крупных карточках
    var OK_SMALL = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" ' +
      'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 12.5 9.5 18 20 6.5"/></svg>';
    [].slice.call(document.querySelectorAll('.sg-big__row, .sg-grad__chip, .sg-grad__css')).forEach(function (row) {
      var ico = row.querySelector('.sg-big__ico');
      var original = ico ? ico.innerHTML : '';
      var isChip = row.classList.contains('sg-grad__chip');
      var cssText = row.querySelector('.sg-grad__csstext');
      row.addEventListener('click', function () {
        var value = row.getAttribute('data-copy');
        var done = function () {
          row.classList.add('is-copied');
          var val = row.querySelector('.sg-big__val');
          if (val && !val.dataset.orig) { val.dataset.orig = val.textContent; val.textContent = 'Скопировано'; }
          if (isChip) {
            var code = row.querySelector('.sg-grad__code');
            if (code && !code.dataset.orig) { code.dataset.orig = code.textContent; code.textContent = 'скопирован'; }
          }
          if (cssText && !cssText.dataset.orig) {
            cssText.dataset.orig = cssText.textContent;
            cssText.textContent = 'Скопировано';
          }
          if (ico) ico.innerHTML = OK_SMALL;
          setTimeout(function () {
            row.classList.remove('is-copied');
            if (ico) ico.innerHTML = original;
            var v = row.querySelector('.sg-big__val');
            if (v && v.dataset.orig) { v.textContent = v.dataset.orig; delete v.dataset.orig; }
            if (isChip) {
              var c = row.querySelector('.sg-grad__code');
              if (c && c.dataset.orig) { c.textContent = c.dataset.orig; delete c.dataset.orig; }
            }
            if (cssText && cssText.dataset.orig) {
              cssText.textContent = cssText.dataset.orig;
              delete cssText.dataset.orig;
            }
          }, 1400);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(value).then(done, done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = value; ta.style.cssText = 'position:absolute;left:-9999px';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          done();
        }
      });
    });

    // копирование HEX по клику на плашку цвета
    var COPY_ICON = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.16146 7H12.8385C13.3657 6.99998 13.8205 6.99997 14.195 7.03057C14.5904 7.06287 14.9836 7.13419 15.362 7.32698C15.9265 7.6146 16.3854 8.07354 16.673 8.63803C16.8658 9.01641 16.9371 9.40963 16.9694 9.80497C17 10.1795 17 10.6343 17 11.1614V18.8385C17 19.3657 17 19.8205 16.9694 20.195C16.9371 20.5904 16.8658 20.9836 16.673 21.362C16.3854 21.9265 15.9265 22.3854 15.362 22.673C14.9836 22.8658 14.5904 22.9371 14.195 22.9694C13.8205 23 13.3658 23 12.8386 23H5.16148C4.63437 23 4.17952 23 3.80497 22.9694C3.40963 22.9371 3.01641 22.8658 2.63803 22.673C2.07354 22.3854 1.6146 21.9265 1.32698 21.362C1.13419 20.9836 1.06287 20.5904 1.03057 20.195C0.999965 19.8205 0.999982 19.3657 1 18.8385V11.1615C0.999982 10.6343 0.999965 10.1796 1.03057 9.80497C1.06287 9.40963 1.13419 9.01641 1.32698 8.63803C1.6146 8.07354 2.07354 7.6146 2.63803 7.32698C3.01641 7.13419 3.40963 7.06287 3.80497 7.03057C4.17953 6.99997 4.63432 6.99998 5.16146 7Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M13.0001 2C13.0001 1.44772 13.4478 1 14.0001 1H16C16.5522 1 17 1.44772 17 2C17 2.55228 16.5522 3 16 3H14.0001C13.4478 3 13.0001 2.55228 13.0001 2ZM11.4999 1.98925C11.5074 2.54148 11.0658 2.99522 10.5136 3.0027C9.81969 3.01211 9.63945 3.06138 9.54601 3.10899C9.35785 3.20487 9.20487 3.35785 9.109 3.54601C9.06139 3.63945 9.01211 3.81968 9.00271 4.51355C8.99523 5.06578 8.54148 5.50739 7.98925 5.49991C7.43702 5.49242 6.99541 5.03868 7.00289 4.48645C7.01179 3.83022 7.04067 3.19995 7.32699 2.63803C7.61461 2.07354 8.07355 1.6146 8.63803 1.32698C9.19996 1.04067 9.83022 1.01178 10.4865 1.00289C11.0387 0.995404 11.4924 1.43701 11.4999 1.98925ZM18.5001 1.98925C18.5076 1.43701 18.9613 0.995404 19.5136 1.00289C20.1698 1.01178 20.8001 1.04067 21.362 1.32698C21.9265 1.6146 22.3854 2.07354 22.673 2.63803C22.9593 3.19995 22.9882 3.83021 22.9971 4.48644C23.0046 5.03867 22.563 5.49241 22.0108 5.4999C21.4585 5.50738 21.0048 5.06577 20.9973 4.51354C20.9879 3.81968 20.9386 3.63945 20.891 3.54601C20.7951 3.35785 20.6422 3.20487 20.454 3.10899C20.3606 3.06139 20.1803 3.01211 19.4865 3.0027C18.9342 2.99522 18.4926 2.54148 18.5001 1.98925ZM22 6.99999C22.5523 6.99999 23 7.44771 23 7.99999V9.99999C23 10.5523 22.5523 11 22 11C21.4477 11 21 10.5523 21 9.99999V7.99999C21 7.44771 21.4477 6.99999 22 6.99999ZM22.0108 12.5001C22.563 12.5076 23.0046 12.9613 22.9971 13.5135C22.9882 14.1698 22.9593 14.8 22.673 15.362C22.3854 15.9265 21.9265 16.3854 21.362 16.673C20.8001 16.9593 20.1698 16.9882 19.5136 16.9971C18.9613 17.0046 18.5076 16.563 18.5001 16.0108C18.4926 15.4585 18.9342 15.0048 19.4865 14.9973C20.1803 14.9879 20.3606 14.9386 20.454 14.891C20.6422 14.7951 20.7951 14.6422 20.891 14.454C20.9386 14.3606 20.9879 14.1803 20.9973 13.4864C21.0048 12.9342 21.4585 12.4926 22.0108 12.5001Z" fill="currentColor"/></svg>';
    var OK_ICON = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" ' +
      'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 12.5 9.5 18 20 6.5"/></svg>';

    [].slice.call(document.querySelectorAll('.style-color-wraper:not(.sg-big)')).forEach(function (el) {
      var txt = el.textContent || '';
      // без \b на конце: в плотной вёрстке сразу за кодом идёт «RGB»
      var m = txt.match(/HEX[:\s]*#?([0-9a-fA-F]{6})/) || txt.match(/HEX[:\s]*#?([0-9a-fA-F]{3})(?![0-9a-fA-F])/);
      if (!m) return;
      var hex = '#' + m[1].toUpperCase();

      el.classList.add('sg-copy');
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', 'Скопировать HEX-код ' + hex);

      var overlay = document.createElement('span');
      overlay.className = 'sg-copy__overlay';
      overlay.setAttribute('aria-hidden', 'true');
      overlay.innerHTML = COPY_ICON + '<span class="sg-copy__label">Скопировать<br>HEX-код</span>';
      el.appendChild(overlay);

      function done() {
        overlay.innerHTML = OK_ICON + '<span class="sg-copy__label">' + hex + '<br>скопирован</span>';
        el.classList.add('is-copied');
        setTimeout(function () {
          el.classList.remove('is-copied');
          overlay.innerHTML = COPY_ICON + '<span class="sg-copy__label">Скопировать<br>HEX-код</span>';
        }, 1400);
      }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = hex; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:absolute;left:-9999px';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(ta);
        done();   // отклик показываем в любом случае, иначе клик выглядит «пустым»
      }
      function copy() {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(hex).then(done, fallback);
        } else { fallback(); }
      }
      el.addEventListener('click', copy);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); }
      });
    });

    // вкладки — и верхнего уровня (несколько наборов материалов целиком, .sg-tabs--lg),
    // и вложенные внутри набора (например «B2B направление» / «Для команды» у презентаций).
    // кнопка ссылается на панель через aria-controls; переключение ищет группу через
    // closest, поэтому вложенная вкладка не трогает состояние внешней
    function activateTab(btn) {
      var group = btn.closest('.sg-tabs');
      if (!group) return;
      [].slice.call(group.querySelectorAll('button[aria-controls]')).forEach(function (b) {
        var on = b === btn;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        var panel = document.getElementById(b.getAttribute('aria-controls'));
        if (panel) panel.hidden = !on;
      });
    }
    // прямая ссылка (#ai-prezentacii и т.п.) может указывать на содержимое, спрятанное
    // сейчас в неактивной вкладке — раскрываем все вкладки-предки, иначе придёт пустое место
    function revealAncestorTabs(id) {
      var node = document.getElementById(id);
      while (node) {
        if (node.classList && node.classList.contains('sg-tabpanel') && node.hidden) {
          var btn = document.querySelector('.sg-tabs button[aria-controls="' + node.id + '"]');
          if (btn) activateTab(btn);
        }
        node = node.parentElement;
      }
    }
    [].slice.call(document.querySelectorAll('.sg-tabs')).forEach(function (group) {
      var buttons = [].slice.call(group.querySelectorAll('button[aria-controls]'));
      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () { activateTab(btn); });
      });
    });
    
    // ─── Scenario pick cards ("Что нужно сделать?") ──────────────────────────
    [].slice.call(document.querySelectorAll('[data-pick-tab]')).forEach(function (card) {
      card.addEventListener('click', function () {
        var btnId = card.getAttribute('data-pick-tab');
        var btn = document.getElementById(btnId);
        if (btn) {
          activateTab(btn);
          var panel = document.getElementById(btn.getAttribute('aria-controls'));
          if (panel) {
            var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            panel.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
          }
        }
      });
    });

    if (location.hash) revealAncestorTabs(location.hash.slice(1));

    if (burger) {
      burger.addEventListener('click', function () {
        var open = nav.classList.toggle('is-open');
        burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }

    // «кратко/подробно» в редполитике: прячем карточки «Почему», когда нужна только быстрая сверка.
    // запоминаем выбор в localStorage — но страница остаётся рабочей и без него (приватный режим и т.п.)
    (function () {
      var toggle = document.getElementById('rp-compact-toggle');
      var section = document.getElementById('redpolitika');
      if (!toggle || !section) return;
      var KEY = 'mk-rp-compact';
      function apply(on) {
        section.classList.toggle('is-compact', on);
        toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
        toggle.textContent = on ? 'Показать подробно — с «Почему»' : 'Показать кратко — скрыть «Почему»';
      }
      var saved = false;
      try { saved = localStorage.getItem(KEY) === '1'; } catch (e) {}
      apply(saved);
      toggle.addEventListener('click', function () {
        var on = toggle.getAttribute('aria-pressed') !== 'true';
        apply(on);
        try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
      });
    })();
  }

  // ─── Тема: тёмный/светлый режим ──────────────────────────────────────────
  // ─── Кнопка «наверх» ─────────────────────────────────────────────────────
  (function () {
    var btn = document.getElementById('sg-back-top');
    if (!btn) return;
    var shown = false;
    function update() {
      var should = window.scrollY > 400;
      if (should !== shown) { shown = should; btn.classList.toggle('is-visible', shown); }
    }
    window.addEventListener('scroll', update, { passive: true });
    btn.addEventListener('click', function () {
      var smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
    });
    update();
  })();

  // ─── Focus trap для мобильного меню ──────────────────────────────────────
  (function () {
    var nav = document.getElementById('sg-nav');
    var burgerBtn = document.getElementById('sg-burger');
    if (!nav || !burgerBtn) return;
    var FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';
    function getFocusable() { return [].slice.call(nav.querySelectorAll(FOCUSABLE)); }

    document.addEventListener('keydown', function (e) {
      if (!nav.classList.contains('is-open')) return;
      if (e.key === 'Escape') {
        nav.classList.remove('is-open');
        burgerBtn.setAttribute('aria-expanded', 'false');
        burgerBtn.focus();
        return;
      }
      if (e.key !== 'Tab') return;
      var focusable = getFocusable();
      if (!focusable.length) return;
      var first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first) { e.preventDefault(); last.focus(); }
      } else {
        if (document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    // Закрыть по клику на затемнение (вне nav и burger)
    document.addEventListener('click', function (e) {
      if (!nav.classList.contains('is-open')) return;
      if (!nav.contains(e.target) && e.target !== burgerBtn) {
        nav.classList.remove('is-open');
        burgerBtn.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
